<!DOCTYPE html>

<style>
:root{color-scheme:light}
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;flex-direction:column;height:100vh;background:#111;font-family:-apple-system,"PingFang SC",sans-serif;overflow:hidden;color:#ccc}
/* top toolbar */
#toolbar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#1e1a14;border-bottom:1px solid #3a3020;flex-shrink:0;flex-wrap:wrap}
#toolbar h2{color:#d4b87a;font-size:12px;margin-right:4px;white-space:nowrap}
.toolBtn{padding:4px 10px;border-radius:4px;border:1.5px solid #5a4a30;background:#2a2010;color:#b4a070;font-size:12px;cursor:pointer;white-space:nowrap}
.toolBtn:hover{background:#3a3020}
.toolBtn.active{border-color:#ffd35a;color:#ffd35a;background:rgba(255,211,90,0.1)}
.sep{width:1px;height:22px;background:#3a3020;margin:0 2px}
#brushSz{accent-color:#d4b87a;width:70px}
#brushStr{accent-color:#d4b87a;width:60px}
/* body row */
#body{display:flex;flex:1;overflow:hidden}
/* sidebar */
#side{width:180px;background:#1e1a14;display:flex;flex-direction:column;border-right:1px solid #3a3020;flex-shrink:0;overflow:hidden}
#assetScroll{flex:1;overflow-y:auto;padding:4px}
.cat{margin-bottom:3px}
.catHead{padding:4px 6px;background:#2a2418;color:#b4a070;font-size:11px;cursor:pointer;border-radius:4px;user-select:none;display:flex;justify-content:space-between}
.catHead:hover{background:#3a3020}
.assetBtn{width:100%;padding:4px 8px 4px 14px;background:none;border:1.5px solid transparent;border-radius:4px;color:#aaa;font-size:11px;text-align:left;cursor:pointer;display:block}
.assetBtn:hover{color:#fff;border-color:#5a4a30}
.assetBtn.active{border-color:#ffd35a;color:#ffd35a;background:rgba(255,211,90,0.08)}
#sideBot{padding:6px;border-top:1px solid #3a3020;display:flex;flex-direction:column;gap:4px}
.propRow{display:flex;align-items:center;gap:5px;font-size:11px;color:#888}
.propRow label{width:40px;flex-shrink:0}
.propRow input[type=range]{flex:1;accent-color:#d4b87a}
.propRow span{width:30px;text-align:right;color:#aaa;font-size:10px}
.smallBtn{padding:4px 6px;border-radius:4px;border:1px solid #5a4a30;background:#2a2010;color:#aaa;font-size:11px;cursor:pointer}
.smallBtn:hover{background:#3a3020;color:#fff}
#btnDel{border-color:#7a3020;color:#e08060}
#btnDel:hover{background:#4a1810}
/* main canvas */
#main{flex:1;position:relative}
#c{display:block;width:100%;height:100%}
#hud{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#555;font-size:11px;pointer-events:none;white-space:nowrap;text-align:center}
#modeTag{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(255,211,90,0.15);border:1px solid #ffd35a;color:#ffd35a;font-size:11px;padding:3px 12px;border-radius:12px;display:none;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:#888;font-size:14px;z-index:20}
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── Terrain fn (matches game) ─────────────────────────────────
function terrainH(x,z){
  const vd=Math.hypot(x*0.75,(z-40)*0.6);
  const flat=Math.min(1,Math.max(0,1-(vd-18)/22));
  let h=(Math.sin(x*0.07)*Math.cos(z*0.05)*2.8+Math.sin(x*0.13+0.9)*Math.sin(z*0.09+1.3)*1.6+Math.sin((x+z)*0.08+2.2)*0.7)*(1-flat);
  const mb=Math.max(0,(z-75)/55); h+=mb*mb*22+Math.sin(x*0.12+1.2)*mb*5;
  h-=Math.max(0,Math.min(1,(-z-12)/5))*10;
  const rf=Math.min(1,Math.max(0,(vd-28)/14));
  h-=Math.max(0,1-Math.abs(x-(50+Math.sin(z*0.035)*10))/10)*3.5*rf;
  return h;
}

// ── Assets ───────────────────────────────────────────────────
const CATALOG=[
  {cat:'树木',items:[
    {label:'Tree 1',path:'assets/vendor/kaykit_forest/Tree_1_A_Color1.gltf'},

// ── Scene ─────────────────────────────────────────────────────
const canvas=document.getElementById('c'),mainDiv=document.getElementById('main');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
let sceneRT=new THREE.WebGLRenderTarget(1,1);let reflRT=new THREE.WebGLRenderTarget(1,1);const reflCam=new THREE.PerspectiveCamera();
const _reflClip=new THREE.Plane(new THREE.Vector3(0,1,0),0);reflCam.matrixAutoUpdate=false;const _reflM=new THREE.Matrix4();

const scene=new THREE.Scene();

// skyMesh removed — Sky addon handles background

const camera=new THREE.PerspectiveCamera(45,1,0.1,2000);
let camR=100,camTheta=0.3,camPhi=0.5;

function camUpdate(){
  camera.position.set(
    camTgt.x+camR*Math.sin(camPhi)*Math.sin(camTheta),
    camTgt.y+camR*Math.cos(camPhi),
    camTgt.z+camR*Math.sin(camPhi)*Math.cos(camTheta));
  camera.lookAt(camTgt);
}
camUpdate();

// ── Sky (自定义渐变天空，颜色直接控制) ───────────────────────
// 参考海平面摄影：顶部深蓝→中段中蓝→地平线浅蓝白
const _skyDome=new THREE.Mesh(new THREE.SphereGeometry(450000,16,8),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{
    uTop:  {value:new THREE.Color(0.18,0.42,0.75)},  // 顶部深蓝 #2E6BC0
    uMid:  {value:new THREE.Color(0.38,0.65,0.88)},  // 中段蓝 #60A6E0
    uHor:  {value:new THREE.Color(0.72,0.85,0.94)},  // 地平线浅蓝白 #B8D9F0
  },
  vertexShader:`varying vec3 vDir;void main(){vDir=normalize((modelMatrix*vec4(position,0.)).xyz);vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position=p.xyww;}`,
  fragmentShader:`uniform vec3 uTop,uMid,uHor;varying vec3 vDir;void main(){float y=clamp(normalize(vDir).y,0.,1.);vec3 c=mix(uHor,uMid,smoothstep(-0.1,0.15,y));c=mix(c,uTop,smoothstep(0.15,1.,y));gl_FragColor=vec4(c,1.);}`
}));
_skyDome.renderOrder=-1;scene.add(_skyDome);
const sunPos=new THREE.Vector3();
sunPos.setFromSphericalCoords(1,THREE.MathUtils.degToRad(30),THREE.MathUtils.degToRad(120));
scene.add(new THREE.HemisphereLight(0xc8d8e8,0x5a5040,1.0));
const sun=new THREE.DirectionalLight(0xfff2d8,1.1);
sun.position.copy(sunPos).multiplyScalar(200);sun.castShadow=true;scene.add(sun);

// ── Terrain (mutable heightmap) ───────────────────────────────
const SZ=260,SEG=130;
const tGeo=new THREE.PlaneGeometry(SZ,SZ,SEG,SEG);
tGeo.rotateX(-Math.PI/2);
const tPos=tGeo.attributes.position;
const hmap=new Float32Array(tPos.count);
for(let i=0;i<tPos.count;i++) hmap[i]=terrainH(tPos.getX(i),tPos.getZ(i));

const cD=new THREE.Color(0x446070),cL=new THREE.Color(0xf0efe8),cH=new THREE.Color(0xeae8e0),cR=new THREE.Color(0xe8e8e6),cS=new THREE.Color(0xf0eef4);
const cRoad=new THREE.Color(0x735f45), cRoadE=new THREE.Color(0x665540);
let roadMask=null;let roadMaskTex=null;
let hmapVirgin=null;
let roadColor='#7d7260';
function _roadRGB(){const rgb=parseInt(roadColor.slice(1),16);return[(rgb>>16)/255,((rgb>>8)&255)/255,(rgb&255)/255];}
function refreshTerrain(){
  const cols=[];
  const [rr,rg,rb]=_roadRGB();
  for(let i=0;i<tPos.count;i++){
    const hv=hmap[i]; tPos.setY(i,hv);
    let c;
    if(hv<-1) c=cD.clone().lerp(cL,Math.min(1,(hv+6)/5));
    else if(hv<5) c=cL.clone().lerp(cH,Math.min(1,(hv+1)/6));
    else if(hv<10) c=cH.clone().lerp(cR,(hv-5)/5);
    else c=cR.clone().lerp(cS,Math.min(1,(hv-10)/10));
    // 道路顶点颜色渐变（GPU三角插值，无环形锯齿）
    if(roadMask&&roadMask[i]>0.01){
      const m=roadMask[i];
      const road=new THREE.Color(rr,rg,rb);
      c.lerp(road, m*m*(3-2*m)*0.95); // smoothstep混入路面色
    }
    cols.push(c.r,c.g,c.b);
  }
  tGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(cols),3));
  tPos.needsUpdate=true; tGeo.computeVertexNormals();
  if(roadMaskTex)updateRoadMaskTex();
  // 只在页面完全初始化后才自动存档（避免初始化时覆盖用户数据）
  if(window._terrainReady) try{const b=new Uint8Array(hmap.buffer);let s='';b.forEach(v=>s+=String.fromCharCode(v));localStorage.setItem('e3d_hmap',btoa(s));localStorage.setItem('e3d_wy',document.getElementById('waterY')?.value??'-2');}catch(e){}
}
refreshTerrain();
const _tl=new THREE.TextureLoader();
const grassTex=_tl.load('./textures/texture_grass.png'),rockTex=_tl.load('./textures/texture_rock.png'),mountTex=_tl.load('./textures/texture_mountain.png'),mudTex=_tl.load('./textures/mud-riverbank-tile-512.png');
[grassTex,rockTex,mountTex,mudTex].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});
const roadStoneTex=new THREE.TextureLoader().load('./textures/texture_road.png',()=>{if(roads.length)drawRoadsToCanvas();});
roadStoneTex.wrapS=roadStoneTex.wrapT=THREE.RepeatWrapping;
const roadGenTex=new THREE.TextureLoader().load('./textures/texture_road.png');
roadGenTex.wrapS=roadGenTex.wrapT=THREE.RepeatWrapping;
const tMat=new THREE.MeshLambertMaterial({vertexColors:true});
tMat.onBeforeCompile=s=>{
  s.uniforms.tGrass={value:grassTex};s.uniforms.tRock={value:rockTex};s.uniforms.tMount={value:mountTex};s.uniforms.tMud={value:mudTex};s.uniforms.tRoadStone={value:roadStoneTex};s.uniforms.tRoadMask={value:roadMaskTex};s.uniforms.tGenerated={value:roadGenTex};
  s.vertexShader=s.vertexShader
    .replace('void main() {','varying vec2 vMyUv;\nvarying float vWY;\nvarying float vNY;\nvoid main() {')
    .replace('\t#include <project_vertex>','\t#include <project_vertex>\nvWY=position.y;\nvMyUv=uv;\nvNY=normal.y;');
  s.fragmentShader=s.fragmentShader
    .replace('void main() {','uniform sampler2D tGrass,tRock,tMount,tMud,tRoadStone,tRoadMask,tGenerated;\nvarying vec2 vMyUv;\nvarying float vWY;\nvarying float vNY;\nvoid main() {')
    .replace('\t#include <color_fragment>','#ifdef USE_COLOR\n  diffuseColor.rgb*=vColor.rgb;\n#endif\n{vec2 u=vMyUv*24.0;vec3 g=texture2D(tGrass,u).rgb,r=texture2D(tRock,u).rgb,m=texture2D(tMount,u).rgb*1.7,md=texture2D(tMud,u).rgb;\nfloat sr=smoothstep(.25,.55,1.-vNY),hr=smoothstep(3.,12.,vWY+g.r*4.-2.),rb=max(sr,hr),mb=smoothstep(18.,24.,vWY);\nfloat noise=g.r*3.-1.5;\nvec3 base=mix(mix(g,r,rb),m,mb);float mudb=1.-smoothstep(-3.,1.5,vWY+noise);vec3 terrain=mix(base,md,mudb);vec2 rmSample=texture2D(tRoadMask,vMyUv).rg;float rm=rmSample.r;float junc=rmSample.g;float hFade=1.-smoothstep(0.,8.,vWY);float rnoise=g.r*0.32+g.b*0.14+hFade*0.12;float rmn=rm-rnoise*0.28;float eNoise=(texture2D(tGrass,vMyUv*80.).r*2.-1.)*.22;float roadEdge=smoothstep(.35,.62,rmn+eNoise);float stoneW=smoothstep(.60,.85,rmn)*(1.-hFade*.65);vec3 rs=texture2D(tRoadStone,vMyUv*48.).rgb;vec3 roadMud=mix(terrain,md,0.65+hFade*0.25);float crackW=smoothstep(.55,.35,rs.r)*0.4;vec3 stoneWithGrass=mix(rs,g*0.8,crackW);vec3 gen=texture2D(tGenerated,vMyUv*56.).rgb;float waterMud=1.-smoothstep(-3.,0.5,vWY);float stoneWAdj=stoneW*(1.-waterMud*.95);vec3 waterRoadMud=mix(terrain,mix(md,gen,waterMud*.9),0.65+hFade*0.25);vec3 road=mix(waterRoadMud,stoneWithGrass,stoneWAdj);float jBlend=clamp(junc+eNoise*.4,0.,1.)*roadEdge;vec3 roadFinal=mix(road,gen,jBlend*.85);diffuseColor.rgb*=mix(terrain,roadFinal,roadEdge);float _luma=dot(diffuseColor.rgb,vec3(.3,.59,.11));diffuseColor.rgb=mix(vec3(_luma),diffuseColor.rgb,1.0+mudb*0.35);}');
};
tMat.polygonOffset=true; tMat.polygonOffsetFactor=1;
const tMesh=new THREE.Mesh(tGeo,tMat); tMesh.receiveShadow=true; scene.add(tMesh);

// ── 道路 canvas 纹理叠加（抗锯齿曲线，无像素格感）──────────
const roadCanvas=document.createElement('canvas'); roadCanvas.width=roadCanvas.height=2048;
const roadCtx=roadCanvas.getContext('2d');
const roadTex=new THREE.CanvasTexture(roadCanvas);
const roadDecal=new THREE.Mesh(tGeo, new THREE.MeshLambertMaterial({
  map:roadTex, transparent:true, depthWrite:false,
  polygonOffset:true, polygonOffsetFactor:-3, polygonOffsetUnits:-3
}));
scene.add(roadDecal);
roadDecal.visible=false;

function toCV(wx,wz){return[(wx+130)/260*2048,(130+wz)/260*2048];}
const roadWidths=[];
const roadTerrainSnaps=[];
function drawRoadsToCanvas(){
  roadCtx.clearRect(0,0,2048,2048);
  const segs=roads.map((pts,i)=>({pts,pw:Math.max(12,(roadWidths[i]??8)/260*2048*2)}));
  function makePat(img,size){const c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(img,0,0,size,size);return roadCtx.createPattern(c,'repeat');}
  const stonePat=roadStoneTex.image?makePat(roadStoneTex.image,64):null;
  const mudPat=mudTex.image?makePat(mudTex.image,128):null;
  function path(pts){roadCtx.beginPath();if(pts.length<2)return;const[sx,sy]=toCV(pts[0][0],pts[0][1]);roadCtx.moveTo(sx,sy);for(let i=0;i<pts.length-1;i++){const[x1,y1]=toCV(pts[i][0],pts[i][1]);const[x2,y2]=toCV(pts[i+1][0],pts[i+1][1]);roadCtx.quadraticCurveTo(x1,y1,(x1+x2)/2,(y1+y2)/2);}const[ex,ey]=toCV(pts[pts.length-1][0],pts[pts.length-1][1]);roadCtx.lineTo(ex,ey);}
  roadCtx.lineCap='round';roadCtx.lineJoin='round';

  for(const{pts,pw}of segs){roadCtx.strokeStyle=mudPat||'rgba(90,62,28,0.9)';roadCtx.lineWidth=pw*0.10;path(pts);roadCtx.stroke();}
  // 再画所有段的石板（统一覆盖）
  for(const{pts,pw}of segs){roadCtx.strokeStyle=stonePat||'rgba(130,110,80,0.95)';roadCtx.lineWidth=pw*0.38;path(pts);roadCtx.stroke();}
  roadTex.needsUpdate=true;
}
// water
const _wTL=new THREE.TextureLoader();
const _tNA=_wTL.load('./textures/water_normal_a.png');
const _tNB=_wTL.load('./textures/water_normal_b.png');
const _tUV=_wTL.load('./textures/water_uv.png');
const _tFoam=_wTL.load('./textures/water_foam_godot.png');
const _tCaust=_wTL.load('./textures/texture_caustics.png');
const _tFoam2=_wTL.load('./textures/water_foam_godot.png');
[_tNA,_tNB,_tUV,_tFoam,_tCaust,_tFoam2].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;});

function applyGhostTransform(){
  if(!ghost) return;
  ghost.rotation.y=+pRot.value*Math.PI/180;
  ghost.scale.setScalar(pSc.value/100);
}

function armAsset(path,btn){
  if(armedBtn) armedBtn.classList.remove('active');
  if(armedPath===path){disarm();return;}
  armedPath=path; armedBtn=btn; btn.classList.add('active');
  setMode('place');
  document.getElementById('modeTag').style.display='block';
  document.getElementById('modeTag').textContent='放置模式: 左键放置 · 右键随机转 · Esc取消';
  loadModel(path).then(m=>{
    if(!m||armedPath!==path) return;
    if(ghost) scene.remove(ghost);
    ghost=m.clone();
    ghost.traverse(o=>{if(o.isMesh&&o.material){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=0.5;}});
    applyGhostTransform();
    scene.add(ghost);
  });
}
function disarm(){armedPath=null;armedBtn=null;if(ghost){scene.remove(ghost);ghost=null;}document.getElementById('modeTag').style.display='none';}

      if(l2<1e-6) continue;
      const t=Math.max(0,Math.min(1,((vx-ax)*dx+(vz-az)*dz)/l2));
      const d=Math.hypot(vx-(ax+t*dx),vz-(az+t*dz));
      if(d<minD) minD=d;
    }
    if(minD<hw+1.5&&hmap[i]>-1.5){
      // 梯形截面：中间平底，两侧线性斜坡
      const k = minD<hw*0.8 ? 1.0 : Math.max(0,(hw+1.5-minD)/1.5);
      hmap[i]=Math.min(hmap[i],hmapVirgin[i]-depth*k);
    }
  }
  // roadMask + 路边小土坡（地形顶点颜色渐变，自然融入地形）
  if(!roadMask) roadMask=new Float32Array(tPos.count);
  const maskSnap=roadMask.slice();
  const fadeW=hw+6;
  for(let i=0;i<tPos.count;i++){
    const vx=tPos.getX(i),vz=tPos.getZ(i);
    let minD2=Infinity;
    for(let j=0;j<pts.length-1;j++){
      const ax=pts[j][0],az=pts[j][1],bx=pts[j+1][0],bz=pts[j+1][1];
      const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz;
      if(l2<1e-6) continue;
      const t=Math.max(0,Math.min(1,((vx-ax)*dx+(vz-az)*dz)/l2));
      const d=Math.hypot(vx-(ax+t*dx),vz-(az+t*dz));
      if(d<minD2) minD2=d;
    }
    // 路边小土坡（hw到hw+2.5处轻微抬高）
    if(minD2>hw&&minD2<hw+2.5&&hmap[i]>-1.5){
      const k=(minD2-hw)/2.5;
      hmap[i]+=0.22*(1-k*k);
    }
    // roadMask平滑渐变
    if(minD2<fadeW) roadMask[i]=Math.max(roadMask[i],Math.max(0,1-minD2/fadeW));
  }
  refreshTerrain();
  roads.push(pts);
  roadWidths.push(roadW);
  roadTerrainSnaps.push({terrain:snap,mask:maskSnap});
  roadLines.push(curRoad);
  curRoad=null;
  drawRoadsToCanvas();
}

function sculpt(e){
  const pt=getTerrainPt(e); if(!pt) return;
  const r=+document.getElementById('brushSz').value;
  const str=+document.getElementById('brushStr').value*0.05;
  if(sculptOp==='flatten'){
    // 先算笔刷范围内的加权平均高度
    let wsum=0,hsum=0;
    for(let i=0;i<tPos.count;i++){
      const dx=tPos.getX(i)-pt.x,dz=tPos.getZ(i)-pt.z,d=Math.sqrt(dx*dx+dz*dz);
      if(d>=r) continue;
      const w=0.5+0.5*Math.cos(d/r*Math.PI);
      wsum+=w; hsum+=hmap[i]*w;
    }
    if(wsum<0.001) return;
    const avg=hsum/wsum;
    // 再把每个顶点推向这个局部均值
    for(let i=0;i<tPos.count;i++){
      const dx=tPos.getX(i)-pt.x,dz=tPos.getZ(i)-pt.z,d=Math.sqrt(dx*dx+dz*dz);
      if(d>=r) continue;
      const w=0.5+0.5*Math.cos(d/r*Math.PI);
      hmap[i]+=(avg-hmap[i])*Math.min(1,str*3*w);
    }
  } else {
    for(let i=0;i<tPos.count;i++){
      const dx=tPos.getX(i)-pt.x,dz=tPos.getZ(i)-pt.z,d=Math.sqrt(dx*dx+dz*dz);
      if(d>=r) continue;
      const w=0.5+0.5*Math.cos(d/r*Math.PI);
      if(sculptOp==='raise') hmap[i]+=str*w;
      else if(sculptOp==='setheight'){const tgt=+document.getElementById('setHVal').value;hmap[i]+=(tgt-hmap[i])*Math.min(1,str*3*w);}
      else hmap[i]-=str*w;
    }
  }
  refreshTerrain();
}

// ── Undo ─────────────────────────────────────────────────────
const undoStack=[];
function undoPush(type,data){
  if(type==='terrain') undoStack.push({type,snap:hmap.slice()});
  else if(type==='place') undoStack.push({type,entry:data});
  if(undoStack.length>30) undoStack.shift();
}
function undoStep(){
  const u=undoStack.pop(); if(!u) return;
  if(u.type==='terrain'){hmap.set(u.snap);refreshTerrain();}
  else if(u.type==='place'){const e=u.entry;scene.remove(e.mesh);placed.splice(placed.indexOf(e),1);if(selectedObj===e)selectedObj=null;}
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') disarm();
  if(e.ctrlKey&&e.key==='z'){
    e.preventDefault();
    if(roads.length>0&&roadLines.length===roads.length){
      const last=roadLines.pop();scene.remove(last.line);roads.pop();roadWidths.pop();
      const snap=roadTerrainSnaps.pop();
      if(snap){hmap.set(snap.terrain);if(snap.mask)roadMask=snap.mask.slice();else roadMask=null;refreshTerrain();}
      drawRoadsToCanvas(); // 撤销后刷新canvas
    } else undoStep();
    return;
  }
  if((e.key==='Delete'||e.key==='Backspace')&&selectedObj&&document.activeElement.tagName!=='INPUT'){
    undoPush('place',selectedObj);
    scene.remove(selectedObj.mesh);placed.splice(placed.indexOf(selectedObj),1);selectedObj=null;
  }
});

function _mkCirrusTex(){
  const W=1024,H=512,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  for(let i=0;i<32;i++){
    const cx=Math.random()*W,cy=Math.random()*H,len=80+Math.random()*300,thick=3+Math.random()*12,ang=(Math.random()-.5)*0.45,op=0.15+Math.random()*0.4;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
    const g=ctx.createRadialGradient(0,0,0,0,0,len/2);
    g.addColorStop(0,`rgba(255,255,255,${op})`);g.addColorStop(0.5,`rgba(255,255,255,${op*0.25})`);g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.scale(1,Math.max(thick/len,0.02));ctx.beginPath();ctx.arc(0,0,len/2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,1);return t;
}
function _mkCloudDome(tex,renderOrd,scrollX,scrollZ,fragOverride){

  const mat=new THREE.ShaderMaterial({
    uniforms:{uMap:{value:tex},uOff:{value:new THREE.Vector2()}},
    vertexShader:`varying vec3 vDir;void main(){vDir=normalize((modelMatrix*vec4(position,0.)).xyz);vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position=p.xyww;}`,
    fragmentShader:frag,
    transparent:true,depthWrite:false,depthTest:true,depthFunc:THREE.LessEqualDepth,side:THREE.BackSide,fog:false
  });
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(450000,32,16),mat);
  mesh.renderOrder=renderOrd;scene.add(mesh);
  return {mesh,t:tex,mat,ox:0,oz:0,sx:scrollX,sz:scrollZ};
}

  _mkCloudBillboard(_ct[2],1.80,1050,330,1300,900),
  _mkCloudBillboard(_ct[1],3.30,1020,330,1300,900),
  _mkCloudBillboard(_ct[3],5.00,1080,330,1300,900),
];
const _cloudLayers=[_mkCloudDome(_cirrusTex,1,.000025,.00001)];
// ── Render ────────────────────────────────────────────────────
function resize(){const w=mainDiv.clientWidth,h=mainDiv.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();const pw=w*renderer.getPixelRatio(),ph=h*renderer.getPixelRatio();sceneRT.setSize(pw,ph);reflRT.setSize(pw,ph);if(wSurfMat)wSurfMat.uniforms.uRes.value.set(pw,ph);}
const _clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const t=_clk.getElapsedTime();if(wSurfMat){wSurfMat.uniforms.uT.value=t;wSurfMat.uniforms.uWaterY.value=wMesh.position.y;}wfMat.uniforms.uT.value=wfMat2.uniforms.uT.value=wfMat3.uniforms.uT.value=wfMat4.uniforms.uT.value=wfMat5.uniforms.uT.value=wfMat6.uniforms.uT.value=t;for(const cl of _cloudLayers){cl.ox+=cl.sx;cl.oz+=cl.sz;cl.mat.uniforms.uOff.value.set(cl.ox,cl.oz);}for(const cb of _cloudBillboards){cb.angle+=cb.speed;cb.mesh.position.x=cb.r*Math.cos(cb.angle);cb.mesh.position.z=cb.r*Math.sin(cb.angle);const dx=camera.position.x-cb.mesh.position.x,dz=camera.position.z-cb.mesh.position.z;cb.mesh.rotation.y=Math.atan2(dx,dz);}
wMesh.visible=false;wSurfs.forEach(s=>{if(s.mesh)s.mesh.visible=false;});const _wy=wMesh.position.y;_reflM.set(1,0,0,0, 0,-1,0,2*_wy, 0,0,1,0, 0,0,0,1);reflCam.projectionMatrix.copy(camera.projectionMatrix);reflCam.matrixWorld.multiplyMatrices(_reflM,camera.matrixWorld);reflCam.matrixWorldInverse.copy(reflCam.matrixWorld).invert();renderer.setClearColor(0x5ab4e8,1);_reflClip.constant=-_wy;renderer.clippingPlanes=[_reflClip];renderer.setRenderTarget(reflRT);renderer.render(scene,reflCam);renderer.clippingPlanes=[];renderer.setRenderTarget(sceneRT);renderer.render(scene,camera);renderer.setClearColor(0x5ab4e8,1);renderer.setRenderTarget(null);wMesh.visible=true;wSurfs.forEach(s=>{if(s.mesh)s.mesh.visible=true;});renderer.render(scene,camera);}
