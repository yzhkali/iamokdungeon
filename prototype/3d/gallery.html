<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8">
<title>角色动画预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1612;color:#d4c4a8;font-family:sans-serif;display:flex;height:100vh;overflow:hidden}
#sidebar{width:200px;background:#120f0c;padding:10px;overflow-y:auto;flex-shrink:0}
#sidebar h3{color:#ffd35a;font-size:12px;margin:8px 0 4px;text-transform:uppercase}
.char-btn{display:block;width:100%;text-align:left;padding:6px 8px;margin:2px 0;background:rgba(255,255,255,0.05);border:1px solid #3a3028;color:#c4b49a;cursor:pointer;border-radius:4px;font-size:12px}
.char-btn:hover,.char-btn.active{background:#3a2e22;border-color:#ffd35a;color:#ffd35a}
#anim-list{margin-top:8px}
.anim-btn{display:block;width:100%;text-align:left;padding:4px 8px;margin:1px 0;background:transparent;border:1px solid #2a2420;color:#9a8a7a;cursor:pointer;border-radius:3px;font-size:11px}
.anim-btn:hover,.anim-btn.active{background:#2a2218;border-color:#c4a060;color:#ffd35a}
#canvas-wrap{flex:1;position:relative}
canvas{display:block;width:100%;height:100%}
#info{position:absolute;bottom:10px;left:10px;font-size:11px;color:#6a5a4a}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a7a6a;font-size:14px;pointer-events:none}
</style>
</head><body>
<div id="sidebar">
  <h3>角色</h3>
  <div id="char-list"></div>
  <h3>动画</h3>
  <div id="anim-list"><div style="color:#5a4a3a;font-size:11px;padding:4px">选择角色后显示</div></div>
</div>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="loading">加载中…</div>
  <div id="info">点击角色 → 选择动画播放</div>
</div>

<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/loaders/GLTFLoader.js":"./lib/GLTFLoader.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const CHARS = [
  {name:'骷髅小兵',path:'assets/vendor/character_gallery/Skeleton_Minion.glb'},
  {name:'骷髅战士',path:'assets/vendor/character_gallery/Skeleton_Warrior.glb'},
  {name:'骷髅法师',path:'assets/vendor/character_gallery/Skeleton_Mage.glb'},
  {name:'骷髅盗贼',path:'assets/vendor/character_gallery/Skeleton_Rogue.glb'},
  {name:'野蛮人',path:'assets/vendor/character_gallery/Barbarian.glb'},
  {name:'骑士',path:'assets/vendor/character_gallery/Knight.glb'},
  {name:'法师',path:'assets/vendor/character_gallery/Mage.glb'},
  {name:'游侠',path:'assets/vendor/character_gallery/Ranger.glb'},
  {name:'盗贼',path:'assets/vendor/character_gallery/Rogue.glb'},
  {name:'骷髅KK小兵',path:'assets/vendor/kaykit_skeletons/Skeleton_Minion.glb'},
  {name:'骷髅KK战士',path:'assets/vendor/kaykit_skeletons/Skeleton_Warrior.glb'},
  {name:'UAL2动画库',path:'assets/vendor/quaternius/UAL2_Standard.glb'},
];

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1612);
scene.fog=new THREE.FogExp2(0x1a1612,0.04);

const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
camera.position.set(0,1.6,4.5);camera.lookAt(0,1,0);

scene.add(new THREE.HemisphereLight(0xb0c0d0,0x40302a,0.9));
const sun=new THREE.DirectionalLight(0xfff2d8,1.2);
sun.position.set(3,8,5);sun.castShadow=true;scene.add(sun);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x2a221a,roughness:0.95}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

// 鼠标旋转
let isDragging=false,lastX=0,camAngle=0,camDist=4.5;
canvas.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX});
canvas.addEventListener('mousemove',e=>{if(!isDragging)return;camAngle+=(e.clientX-lastX)*0.01;lastX=e.clientX;updateCam();});
canvas.addEventListener('mouseup',()=>isDragging=false);
canvas.addEventListener('wheel',e=>{camDist=Math.max(1.5,Math.min(8,camDist+e.deltaY*0.005));updateCam();},{passive:true});
function updateCam(){camera.position.set(Math.sin(camAngle)*camDist,1.6,Math.cos(camAngle)*camDist);camera.lookAt(0,1,0);}

const loader=new GLTFLoader();
const clock=new THREE.Clock();
let mixer=null,currentModel=null,activeAnimBtn=null,activeCharBtn=null;
const loadingEl=document.getElementById('loading');

function loadChar(c,btn){
  if(activeCharBtn){activeCharBtn.classList.remove('active');}
  btn.classList.add('active');activeCharBtn=btn;
  loadingEl.style.display='flex';
  if(currentModel){scene.remove(currentModel);currentModel=null;}
  if(mixer){mixer.stopAllAction();mixer=null;}
  document.getElementById('anim-list').innerHTML='<div style="color:#5a4a3a;font-size:11px;padding:4px">加载中…</div>';
  loader.load(c.path,gltf=>{
    const model=gltf.scene;
    // 自动居中+缩放
    const box=new THREE.Box3().setFromObject(model);
    const size=box.getSize(new THREE.Vector3());
    const center=box.getCenter(new THREE.Vector3());
    const scale=2.0/Math.max(size.x,size.y,size.z);
    model.scale.setScalar(scale);
    model.position.set(-center.x*scale,(-box.min.y)*scale,-center.z*scale);
    model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    scene.add(model);currentModel=model;
    loadingEl.style.display='none';
    if(gltf.animations.length>0){
      mixer=new THREE.AnimationMixer(model);
      const animList=document.getElementById('anim-list');
      animList.innerHTML='';
      gltf.animations.forEach((clip,i)=>{
        const b=document.createElement('button');
        b.className='anim-btn';
        b.textContent=`${clip.name} (${clip.duration.toFixed(1)}s)`;
        b.onclick=()=>{
          if(activeAnimBtn)activeAnimBtn.classList.remove('active');
          b.classList.add('active');activeAnimBtn=b;
          mixer.stopAllAction();
          mixer.clipAction(clip).reset().play();
        };
        animList.appendChild(b);
        if(i===0){b.click();}  // 自动播第一个
      });
    } else {
      document.getElementById('anim-list').innerHTML='<div style="color:#5a4a3a;font-size:11px;padding:4px">无动画</div>';
    }
  },undefined,err=>{loadingEl.textContent='加载失败';console.error(err);});
}

// 建角色列表
const charList=document.getElementById('char-list');
CHARS.forEach(c=>{
  const b=document.createElement('button');
  b.className='char-btn';b.textContent=c.name;
  b.onclick=()=>loadChar(c,b);
  charList.appendChild(b);
});

function resize(){const w=canvas.parentElement.clientWidth,h=canvas.parentElement.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(canvas.parentElement);resize();

(function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();if(mixer)mixer.update(dt);renderer.render(scene,camera);})();

// 默认加载第一个
charList.firstChild.click();
</script>
</body></html>
