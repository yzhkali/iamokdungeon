<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>骨架对比 — 23根 vs 65根</title>
<style>
  :root{color-scheme:light;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#10131a;
    font-family:-apple-system,"Microsoft YaHei",sans-serif;user-select:none;color:#cdd6e4;}
  #c{display:block;width:100%;height:100%;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7fa8d8;font-size:16px;z-index:20;}
  #top{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;}
  #top h1{font-size:16px;color:#9fc0e8;font-weight:700;}
  #top p{font-size:12px;color:#6b7689;margin-top:4px;}
  .tag{position:absolute;top:64px;z-index:10;font-size:13px;font-weight:700;padding:6px 14px;border-radius:8px;}
  #tagL{left:18%;color:#ffd35a;background:rgba(60,48,16,0.6);border:1px solid #6e5b2a;}
  #tagR{right:18%;color:#5bd6c0;background:rgba(16,55,50,0.6);border:1px solid #2a6e5b;}
  #ctrl{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;gap:10px;background:rgba(16,19,26,0.85);padding:10px 16px;border-radius:12px;border:1px solid #2a3344;}
  .btn{padding:8px 14px;border-radius:7px;border:1px solid #3a4658;background:rgba(40,50,68,0.7);color:#aebfd6;font-size:13px;cursor:pointer;}
  .btn:hover{border-color:#5b7aa8;color:#dce6f4;}
  .btn.on{border-color:#7fa8d8;color:#fff;background:rgba(60,90,140,0.6);}
  #hint{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);z-index:10;color:#5a6478;font-size:11px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">加载中…</div>
<div id="top">
  <h1>🦴 骨架结构对比</h1>
  <p>左:KayKit 骷髅(23根) ・ 右:Quaternius(65根) ・ 鼠标拖动旋转 ・ 滚轮缩放</p>
</div>
<div class="tag" id="tagL">KayKit · 23 根</div>
<div class="tag" id="tagR">Quaternius · 65 根</div>
<div id="hint">绿色小球=骨骼关节 ・ 线=骨骼连接</div>
<div id="ctrl">
  <button class="btn on" id="bMesh">显示模型皮肤</button>
  <button class="btn on" id="bBone">显示骨架</button>
  <button class="btn" id="bLabel">显示骨骼名</button>
  
</div>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/loaders/GLTFLoader.js": "./lib/GLTFLoader.js"
  }
}
</script>
<script type="module">
const loadingEl=document.getElementById('loading');
let THREE=null;
const T_SRC=["three"];
for(let i=0;i<T_SRC.length;i++){ try{ THREE=await import(T_SRC[i]); if(THREE&&THREE.Scene)break; }catch(e){} }
if(!THREE){ loadingEl.textContent='引擎加载失败'; throw new Error('x'); }
let GLTFLoader=null;
const G_SRC=["three/addons/loaders/GLTFLoader.js"];
for(let i=0;i<G_SRC.length;i++){ try{ const m=await import(G_SRC[i]); GLTFLoader=m.GLTFLoader; if(GLTFLoader)break; }catch(e){} }

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x10131a);
const camera=new THREE.PerspectiveCamera(50,1,0.1,200); camera.position.set(0,1.3,7);
scene.add(new THREE.HemisphereLight(0xaabbdd,0x333344,1.1));
const dl=new THREE.DirectionalLight(0xffffff,1.2); dl.position.set(4,8,6); scene.add(dl);

const loader=new GLTFLoader();
const groupL=new THREE.Group(); groupL.position.x=-1.8; scene.add(groupL);
const groupR=new THREE.Group(); groupR.position.x=1.8; scene.add(groupR);
const labelSprites=[];
let meshes=[],helpers=[];

function makeLabel(text){
  const cv=document.createElement('canvas'); cv.width=128; cv.height=32;
  const x=cv.getContext('2d'); x.fillStyle='rgba(0,0,0,0.5)'; x.fillRect(0,0,128,32);
  x.fillStyle='#9fe8c0'; x.font='16px monospace'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,64,16);
  const tex=new THREE.CanvasTexture(cv);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.scale.set(0.5,0.125,1); sp.visible=false; labelSprites.push(sp); return sp;
}

const TARGET_H=2.4;  // 统一目标身高,两个模型都缩放到这个高度
function addModel(file,group,color){
  loader.load('./assets/vendor/skeleton_compare/'+file, gltf=>{
    const m=gltf.scene;
    // 先把模型放进场景图才能算出正确世界包围盒
    group.add(m);
    m.updateWorldMatrix(true,true);
    const box=new THREE.Box3().setFromObject(m);
    const sz=box.getSize(new THREE.Vector3());
    const s=TARGET_H/Math.max(sz.y,0.001);
    m.scale.setScalar(s);
    m.updateWorldMatrix(true,true);
    const b2=new THREE.Box3().setFromObject(m); const c2=b2.getCenter(new THREE.Vector3());
    m.position.set(-c2.x,-b2.min.y,-c2.z);
    meshes.push(m);
    // 骨架helper
    const helper=new THREE.SkeletonHelper(m); helper.material.linewidth=2;
    scene.add(helper); helpers.push({helper,group});
    // 关节小球 + 名字标签
    m.traverse(o=>{
      if(o.isBone){
        const ball=new THREE.Mesh(new THREE.SphereGeometry(0.025/s,8,8),new THREE.MeshBasicMaterial({color:color}));
        o.add(ball);
        const lb=makeLabel(o.name); lb.position.y=0.06; o.add(lb);
      }
    });
    loadingEl.style.display='none';
  });
}
addModel('kaykit_23.glb',groupL,0xffd35a);
addModel('quaternius_65.glb',groupR,0x5bd6c0);

// 控制
const bMesh=document.getElementById('bMesh'),bBone=document.getElementById('bBone'),bLabel=document.getElementById('bLabel');
bMesh.onclick=()=>{ bMesh.classList.toggle('on'); const on=bMesh.classList.contains('on'); meshes.forEach(m=>m.traverse(o=>{if(o.isMesh)o.visible=on;})); };
bBone.onclick=()=>{ bBone.classList.toggle('on'); const on=bBone.classList.contains('on'); helpers.forEach(h=>h.helper.visible=on); };
bLabel.onclick=()=>{ bLabel.classList.toggle('on'); const on=bLabel.classList.contains('on'); labelSprites.forEach(s=>s.visible=on); };

// ===== 自由飞行相机:WASD平移 / 鼠标拖动转视角 / QE升降 / 滚轮调速 =====
const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true; });
addEventListener('keyup',e=>{ keys[e.code]=false; });
let yaw=0, pitch=0;           // 视角朝向(弧度)
let dragging=false, lx=0, ly=0;
let moveSpeed=3.0;            // 平移速度(滚轮可调)
canvas.addEventListener('mousedown',e=>{ dragging=true; lx=e.clientX; ly=e.clientY; });
addEventListener('mouseup',()=>dragging=false);
addEventListener('mousemove',e=>{
  if(dragging){
    yaw   -= (e.clientX-lx)*0.004;
    pitch -= (e.clientY-ly)*0.004;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));   // 限制俯仰
    lx=e.clientX; ly=e.clientY;
  }
});
canvas.addEventListener('wheel',e=>{ moveSpeed=Math.max(0.5,Math.min(12,moveSpeed - e.deltaY*0.003)); e.preventDefault(); },{passive:false});

const _fwd=new THREE.Vector3(), _right=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);
let lastT=performance.now();
function updateCamera(){
  const now=performance.now(); const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  // 由 yaw/pitch 算前方向
  _fwd.set( Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch) ).normalize();
  _right.crossVectors(_fwd,_up).normalize();
  const v=moveSpeed*dt;
  if(keys['KeyW']) camera.position.addScaledVector(_fwd, v);
  if(keys['KeyS']) camera.position.addScaledVector(_fwd,-v);
  if(keys['KeyD']) camera.position.addScaledVector(_right, v);
  if(keys['KeyA']) camera.position.addScaledVector(_right,-v);
  if(keys['KeyE']||keys['Space']) camera.position.y += v;
  if(keys['KeyQ']||keys['ShiftLeft']) camera.position.y -= v;
  camera.lookAt(camera.position.clone().add(_fwd));
}

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
function loop(){ updateCamera(); renderer.render(scene,camera); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
