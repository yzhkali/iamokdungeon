<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>Quaternius 人类 + 65骨 + 43动画 Demo</title>
<style>:root{color-scheme:light;}*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0e1218;
font-family:-apple-system,"Microsoft YaHei",sans-serif;user-select:none;}
#c{display:block;width:100%;height:100%;}
#ui{position:absolute;top:16px;left:16px;z-index:10;background:rgba(12,16,22,.9);
border:1px solid #2a4a6a;border-radius:10px;padding:12px 16px;color:#c8daf0;max-width:280px;max-height:80vh;overflow-y:auto;}
#ui h2{font-size:14px;color:#7fb8ff;margin-bottom:8px;}
.aBtn{cursor:pointer;padding:2px 8px;border-radius:4px;display:inline-block;font-size:12px;line-height:1.9;white-space:nowrap;}
.aBtn:hover{background:rgba(127,184,255,.15);}
.aBtn.on{background:rgba(127,184,255,.25);color:#7fb8ff;}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
color:#3a5a7a;font-size:12px;z-index:10;text-align:center;}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
color:#7fb8ff;font-size:16px;z-index:20;}
#tag{position:absolute;top:16px;right:16px;color:#5bd6c0;font-size:13px;z-index:10;
background:rgba(12,16,22,.8);border:1px solid #2a6a5a;border-radius:8px;padding:8px 12px;}
</style></head><body>
<canvas id="c"></canvas>
<div id="loading">加载 Quaternius 角色(7.7MB)…</div>
<div id="ui"><h2>⚔️ Quaternius 65骨 · 43动画</h2><div id="animList">加载中…</div></div>
<div id="tag">65根骨骼 · 含剑击三连</div>
<div id="hint">WASD 移动 · 鼠标拖动旋转镜头 · 左侧列表切换动画</div>
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/loaders/GLTFLoader.js":"./lib/GLTFLoader.js"}}</script>
<script type="module">
const loadingEl=document.getElementById('loading');
let THREE=null;
for(const s of["three","https://unpkg.com/three@0.160.0/build/three.module.js"]){try{THREE=await import(s);if(THREE?.Scene)break;}catch(e){}}
if(!THREE){loadingEl.textContent='引擎加载失败';throw 0;}
let GLTFLoader=null;
for(const s of["three/addons/loaders/GLTFLoader.js","https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"]){try{const m=await import(s);GLTFLoader=m.GLTFLoader;if(GLTFLoader)break;}catch(e){}}

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0e1218);
scene.fog=new THREE.Fog(0x0e1218,20,60);
const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
camera.position.set(0,1.8,5);
scene.add(new THREE.HemisphereLight(0xa0b8d8,0x1a2030,.9));
const dl=new THREE.DirectionalLight(0xfff4e0,1.2);dl.position.set(5,10,6);dl.castShadow=true;scene.add(dl);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x141a22,roughness:.95}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

const loader=new GLTFLoader();
// UAL2_Standard.glb 里模型+43个动画全在一起
loadingEl.textContent='加载 Quaternius 角色(7.7MB)…请稍候';
const gltf=await new Promise((res,rej)=>loader.load('./assets/vendor/quaternius/UAL2_Standard.glb',res,p=>{
  if(p.total)loadingEl.textContent=`加载中 ${Math.round(p.loaded/p.total*100)}%…`;
},rej));

const model=gltf.scene;
const box=new THREE.Box3().setFromObject(model);
const h=box.getSize(new THREE.Vector3()).y;
model.scale.setScalar(1.2/Math.max(h,.01));
const b2=new THREE.Box3().setFromObject(model);
model.position.y=-b2.min.y;
model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
scene.add(model);

const clips=gltf.animations;
const mixer=new THREE.AnimationMixer(model);
let curAction=null;
function playClip(clip){
  if(curAction)curAction.fadeOut(.25);
  curAction=mixer.clipAction(clip);
  curAction.reset().fadeIn(.25).play();
}

// 渲染动画列表(按类型分组显示)
const list=document.getElementById('animList');
list.innerHTML='';
const groups={
  '⚔️ 攻击':['Sword_Regular_A','Sword_Regular_B','Sword_Regular_C','Sword_Regular_Combo','Sword_Regular_A_Rec','Sword_Regular_B_Rec','Melee_Hook','Melee_Hook_Rec','Shield_OneShot','OverhandThrow'],
  '🏃 移动':['Slide_Start','Slide_Loop','Slide_Exit','Sword_Dash_RM','Shield_Dash_RM','ClimbUp_1m_RM'],
  '🧍 待机':['Idle_FoldArms_Loop','Idle_Lantern_Loop','Idle_No_Loop','Idle_Rail_Loop','Idle_Rail_Call','Idle_Shield_Loop','NinjaJump_Idle_Loop'],
  '💥 受击':['Hit_Knockback','Hit_Knockback_RM','Idle_Shield_Break'],
  '🧟 僵尸':['Zombie_Idle_Loop','Zombie_Walk_Fwd_Loop','Zombie_Scratch'],
  '🔧 其他':['A_TPose','Consume','Farm_Harvest','Farm_PlantSeed','Farm_Watering','LayToIdle','NinjaJump_Start','NinjaJump_Land','Sword_Block','Walk_Carry_Loop','Yes','Chest_Open'],
};
let firstCLip=null;
for(const [g,names] of Object.entries(groups)){
  const h3=document.createElement('div');
  h3.textContent=g; h3.style.cssText='font-size:11px;color:#5a7a9a;margin:8px 0 2px;';
  list.appendChild(h3);
  names.forEach(name=>{
    const clip=clips.find(c=>c.name===name);
    if(!clip)return;
    if(!firstCLip)firstCLip=clip;
    const d=document.createElement('div');
    const btn=document.createElement('span');
    btn.className='aBtn'; btn.id='ab_'+name;
    btn.innerHTML=`${name} <small style="color:#3a5a7a">${clip.duration.toFixed(1)}s</small>`;
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.aBtn').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on'); playClip(clip);
    });
    d.appendChild(btn); list.appendChild(d);
  });
}
if(firstCLip){playClip(firstCLip);document.getElementById('ab_'+firstCLip.name)?.classList.add('on');}

// 镜头
let yaw=0,pitch=.2,dist=5,drag=false,lx=0,ly=0;
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(drag){yaw-=(e.clientX-lx)*.006;pitch-=(e.clientY-ly)*.006;pitch=Math.max(-.3,Math.min(1.3,pitch));lx=e.clientX;ly=e.clientY;}});
canvas.addEventListener('wheel',e=>{dist=Math.max(1.5,Math.min(12,dist+e.deltaY*.005));e.preventDefault();},{passive:false});
const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
const target=new THREE.Vector3(0,1.1,0);
const clock=new THREE.Clock();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
loadingEl.style.display='none';
function loop(){
  const dt=Math.min(clock.getDelta(),.05); mixer.update(dt);
  const spd=4*dt;
  if(keys['KeyW'])target.z-=Math.cos(yaw)*spd,target.x-=Math.sin(yaw)*spd;
  if(keys['KeyS'])target.z+=Math.cos(yaw)*spd,target.x+=Math.sin(yaw)*spd;
  if(keys['KeyA'])target.x-=Math.cos(yaw)*spd,target.z+=Math.sin(yaw)*spd;
  if(keys['KeyD'])target.x+=Math.cos(yaw)*spd,target.z-=Math.sin(yaw)*spd;
  model.position.x=target.x;model.position.z=target.z;
  camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist,target.z+Math.cos(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(target);
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
loop();
</script></body></html>
