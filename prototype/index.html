<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>没事地下城 / I'm OK Dungeon — 战斗原型 v0.2</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1614;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas {
    background: #2b2420;
    image-rendering: pixelated;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    touch-action: none;
  }
  #inputUI { position: absolute; top: 16px; left: 16px; display: flex; gap: 10px; z-index: 10; }
  .modeBtn {
    width: 56px; height: 56px; border-radius: 12px;
    background: rgba(20,16,14,0.7); border: 2px solid #5a4d42;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s ease; backdrop-filter: blur(4px);
  }
  .modeBtn svg { width: 30px; height: 30px; fill: #8a7d70; transition: fill .15s; }
  .modeBtn:hover { border-color: #8a7d72; }
  .modeBtn.active { border-color: #ffd35a; background: rgba(70,55,20,0.85); box-shadow: 0 0 16px rgba(255,211,90,0.5); }
  .modeBtn.active svg { fill: #ffd35a; }
  .modeBtn .label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #8a7d70; white-space: nowrap; }
  .modeBtn.active .label { color: #ffd35a; }
  #hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); color: #6b5f54; font-size: 12px; text-align: center; line-height: 1.6; z-index: 10; pointer-events: none; }
  #padStatus { position: absolute; top: 20px; right: 16px; color: #6b5f54; font-size: 11px; text-align: right; z-index: 10; }
  #padStatus .on { color: #7ec97e; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>

<div id="inputUI">
  <div class="modeBtn active" id="btnKeyboard" title="键盘 / 鼠标">
    <svg viewBox="0 0 24 24"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm1 3v2h2V8H5zm3 0v2h2V8H8zm3 0v2h2V8h-2zm3 0v2h2V8h-2zm3 0v2h2V8h-2zM5 11v2h2v-2H5zm3 0v2h2v-2H8zm3 0v2h2v-2h-2zm3 0v2h2v-2h-2zm3 0v2h2v-2h-2zM8 14v2h8v-2H8z"/></svg>
    <span class="label">键盘</span>
  </div>
  <div class="modeBtn" id="btnGamepad" title="Xbox 手柄">
    <svg viewBox="0 0 24 24"><path d="M7.5 6h9a5.5 5.5 0 0 1 5.5 5.5c0 .9-.1 1.8-.4 2.6l-1.2 3.4a2.4 2.4 0 0 1-4.3.5L14.5 16h-5l-1.6 2A2.4 2.4 0 0 1 3.6 17.5L2.4 14.1A8 8 0 0 1 2 11.5 5.5 5.5 0 0 1 7.5 6zM7 9v2H5v2h2v2h2v-2h2v-2H9V9H7zm9 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2.5 2.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>
    <span class="label">手柄</span>
  </div>
</div>

<div id="padStatus">手柄: <span id="padState">未连接</span></div>

<div id="hint">
  键盘：WASD 移动 ・ 左键 轻击 ・ <b>按住右键蓄力</b>重击 ・ 空格 跳跃 ・ Shift 闪避(消耗体力)<br>
  手柄：左摇杆 移动 ・ X 轻击 ・ <b>按住Y蓄力</b>重击 ・ A 跳跃 ・ B 闪避
</div>

<script>
// ============================================================
//  没事地下城 — 战斗原型 v0.2
//  改进：伪跑动 / 修白边 / 动态影子 / 攻击特效(前冲+刀光+顿帧+震屏)
//        瞬间转向 / 重击蓄力 / 闪避破僵直 + 体力系统
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- 资源 ----------
const DIRS = ['d','dr','r','ur','u','ul','l','dl'];
const sprites = {};
let loaded = 0; const total = DIRS.length;
DIRS.forEach(d => { const img=new Image(); img.onload=()=>loaded++; img.src=`assets/honest_man/stand_${d}.png`; sprites[d]=img; });
const SPRITE_SCALE = 0.42;

const DIR_VEC = {
  r:[1,0], dr:[0.7071,0.7071], d:[0,1], dl:[-0.7071,0.7071],
  l:[-1,0], ul:[-0.7071,-0.7071], u:[0,-1], ur:[0.7071,-0.7071]
};

// ---------- 输入（动作映射） ----------
const Actions = { moveX:0, moveY:0, attack:false, jump:false, dodge:false,
                  heavyHeld:false, heavyReleased:false };
const prev = { attack:false, jump:false, dodge:false, heavy:false };
let inputMode = 'keyboard';

const keys = {}; const mouse = { left:false, right:false };
window.addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space')e.preventDefault(); });
window.addEventListener('keyup', e=>{ keys[e.code]=false; });
canvas.addEventListener('mousedown', e=>{ if(e.button===0)mouse.left=true; if(e.button===2)mouse.right=true; });
window.addEventListener('mouseup', e=>{ if(e.button===0)mouse.left=false; if(e.button===2)mouse.right=false; });
canvas.addEventListener('contextmenu', e=>e.preventDefault());
window.addEventListener('keydown', ()=>{ if(inputMode!=='keyboard')setMode('keyboard'); });
canvas.addEventListener('mousedown', ()=>{ if(inputMode!=='keyboard')setMode('keyboard'); });

let gamepadIndex=null;
window.addEventListener('gamepadconnected', e=>{ gamepadIndex=e.gamepad.index; updatePadStatus(); });
window.addEventListener('gamepaddisconnected', e=>{ if(gamepadIndex===e.gamepad.index)gamepadIndex=null; updatePadStatus(); });
function updatePadStatus(){ const el=document.getElementById('padState'); if(gamepadIndex!==null){el.textContent='已连接 ✓';el.className='on';}else{el.textContent='未连接';el.className='';} }

const btnKb=document.getElementById('btnKeyboard'), btnGp=document.getElementById('btnGamepad');
function setMode(m){ inputMode=m; btnKb.classList.toggle('active',m==='keyboard'); btnGp.classList.toggle('active',m==='gamepad'); }
btnKb.addEventListener('click',()=>setMode('keyboard')); btnGp.addEventListener('click',()=>setMode('gamepad'));

function pollInput(){
  let mx=0,my=0,aAtk=false,aHeavy=false,aJump=false,aDodge=false;
  if(inputMode==='keyboard'){
    if(keys['KeyA'])mx-=1; if(keys['KeyD'])mx+=1; if(keys['KeyW'])my-=1; if(keys['KeyS'])my+=1;
    aAtk=mouse.left; aHeavy=mouse.right; aJump=!!keys['Space']; aDodge=!!(keys['ShiftLeft']||keys['ShiftRight']);
  } else {
    const gp=(gamepadIndex!==null)?navigator.getGamepads()[gamepadIndex]:null;
    if(gp){
      const dz=0.25; let lx=gp.axes[0]||0, ly=gp.axes[1]||0;
      if(Math.abs(lx)<dz)lx=0; if(Math.abs(ly)<dz)ly=0; mx=lx; my=ly;
      if(gp.buttons[14]?.pressed)mx-=1; if(gp.buttons[15]?.pressed)mx+=1;
      if(gp.buttons[12]?.pressed)my-=1; if(gp.buttons[13]?.pressed)my+=1;
      aJump=gp.buttons[0]?.pressed; aDodge=gp.buttons[1]?.pressed; aAtk=gp.buttons[2]?.pressed; aHeavy=gp.buttons[3]?.pressed;
    }
  }
  const len=Math.hypot(mx,my); if(len>1){mx/=len;my/=len;}
  Actions.moveX=mx; Actions.moveY=my;
  Actions.attack=aAtk&&!prev.attack;
  Actions.jump=aJump&&!prev.jump;
  Actions.dodge=aDodge&&!prev.dodge;
  Actions.heavyHeld=aHeavy;
  Actions.heavyReleased=(!aHeavy)&&prev.heavy;
  prev.attack=aAtk; prev.jump=aJump; prev.dodge=aDodge; prev.heavy=aHeavy;
}
function autoDetectPad(){
  if(gamepadIndex===null)return; const gp=navigator.getGamepads()[gamepadIndex]; if(!gp)return;
  if((gp.buttons.some(b=>b.pressed)||gp.axes.some(a=>Math.abs(a)>0.5))&&inputMode!=='gamepad')setMode('gamepad');
}

// ---------- 房间 ----------
const room = { x:60, y:60, w:W-120, h:H-120 };

// ---------- 玩家 ----------
const player = {
  x:W/2, y:H/2, facing:'d', r:18,
  jumpZ:0, jumpVz:0, jumping:false,
  // 状态机：idle/run 由移动判断；动作状态如下
  state:'idle',            // 'idle'|'attack'|'heavy'|'dodge'
  // 攻击
  attackTimer:0, attackDur:0, attackType:null, lunge:0,
  // 重击蓄力
  charging:false, chargeT:0,
  // 闪避
  dodgeT:0, dodgeDx:0, dodgeDy:0, iframe:0,
  // 体力
  stamina:100, staminaMax:100,
  // 伪跑动用
  runPhase:0, moving:false, speedMag:0,
};

// 手感参数（全部可调）
const MOVE_SPEED=2.6;
const TURN_INSTANT=true;            // 瞬间转向
const JUMP_V=5.2, GRAVITY=0.32;
const LIGHT_DUR=0.18, LIGHT_RECOVER=0.10, LIGHT_LUNGE=3.2, LIGHT_REACH=46, LIGHT_R=32;
const HEAVY_MIN_DUR=0.30, HEAVY_LUNGE=5.5;     // 重击基础
const CHARGE_MAX=1.1;               // 最大蓄力秒数
const CHARGE_MOVE_MULT=0.38;        // 蓄力时移动减速
const CHARGE_AUTO_RELEASE=1.0;      // 蓄满后多久不释放就自动泄力(秒)
const DODGE_DUR=0.18, DODGE_SPEED=8.5, DODGE_IFRAME=0.16, DODGE_COST=70;
const STAM_REGEN=10;                // 每秒回复(老实人基准:满100/闪避耗70/回10 → 连闪间隔约4s,回满约7s)
const STAM_REGEN_DELAY=0.0;         // 无延迟,匹配设定的回复节奏
let staminaDelay=0;

// 特效容器
const slashes=[]; const hitsparks=[];
let shake=0, hitstop=0;

function vecToDir(dx,dy){
  if(dx===0&&dy===0)return null;
  const ang=Math.atan2(dy,dx);
  const oct=Math.round(ang/(Math.PI/4));
  const map={0:'r',1:'dr',2:'d',3:'dl',4:'l','-4':'l','-3':'ul','-2':'u','-1':'ur'};
  return map[oct]??'d';
}

function startSlash(type, chargeRatio=0){
  const v=DIR_VEC[player.facing];
  const reach = type==='heavy' ? (60+chargeRatio*40) : LIGHT_REACH;
  const rad = type==='heavy' ? (38+chargeRatio*34) : LIGHT_R;
  slashes.push({
    x:player.x+v[0]*reach*0.45, y:player.y+v[1]*reach*0.45,
    dir:player.facing, type, r:rad, life:0.18, maxLife:0.18, charge:chargeRatio
  });
  // 命中火花（占位：以后接到敌人命中时触发）
  // 顿帧 & 震屏
  if(type==='heavy'){ hitstop=0.04+chargeRatio*0.06; shake=4+chargeRatio*7; }
  else { hitstop=0.02; shake=2.5; }
}

let last=performance.now();
function update(dt){
  pollInput(); autoDetectPad();

  // 顿帧：冻结玩家逻辑但特效继续（这里简单整体冻结一小会）
  if(hitstop>0){ hitstop-=dt; updateFx(dt); return; }

  if(player.iframe>0)player.iframe-=dt;

  const inAction = (player.state==='attack'||player.state==='heavy');
  const canAct = !player.jumping; // 跳跃中不普攻（可改）

  // ---- 闪避（可破僵直/跳跃，消耗体力）----
  if(Actions.dodge && player.state!=='dodge' && player.stamina>=DODGE_COST){
    let dx=Actions.moveX, dy=Actions.moveY;
    if(dx===0&&dy===0){ const v=DIR_VEC[player.facing]; dx=v[0]; dy=v[1]; }
    const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
    player.state='dodge'; player.dodgeT=DODGE_DUR; player.dodgeDx=dx; player.dodgeDy=dy;
    player.iframe=DODGE_IFRAME; player.stamina-=DODGE_COST; staminaDelay=STAM_REGEN_DELAY;
    player.facing=vecToDir(dx,dy)||player.facing;
    // 破僵直：清掉攻击/蓄力；并取消跳跃(落地闪)
    player.charging=false; player.chargeHold=0; player.attackTimer=0; player.attackType=null;
    player.jumping=false; player.jumpZ=0; player.jumpVz=0;
  }

  // ---- 重击蓄力 ----
  if(player.state!=='dodge'){
    if(Actions.heavyHeld && !player.charging && player.state!=='attack' && player.state!=='heavy' && canAct){
      // 开始蓄力
      player.charging=true; player.chargeT=0; player.chargeHold=0;
    }
    if(player.charging){
      if(Actions.heavyHeld){
        player.chargeT=Math.min(CHARGE_MAX, player.chargeT+dt);
        staminaDelay=STAM_REGEN_DELAY;
        // 蓄满后开始计自动泄力时间
        if(player.chargeT>=CHARGE_MAX){ player.chargeHold=(player.chargeHold||0)+dt; }
        // 蓄满保持太久 → 自动泄力(不放招,直接取消)
        if((player.chargeHold||0) >= CHARGE_AUTO_RELEASE){
          player.charging=false; player.chargeHold=0;
        }
      }
      if(Actions.heavyReleased && player.charging){
        // 释放重击：蓄越久，伤害/范围越大，后摇越长
        const ratio=player.chargeT/CHARGE_MAX;
        player.charging=false; player.chargeHold=0;
        player.state='heavy'; player.attackType='heavy';
        player.attackDur = HEAVY_MIN_DUR + ratio*0.5;       // 总时长
        player.recover   = 0.14 + ratio*0.5;                // 后摇（越久越长）
        player.attackTimer = player.attackDur + player.recover;
        player.lunge = HEAVY_LUNGE + ratio*4;
        startSlash('heavy', ratio);
      }
    }
  }

  // ---- 轻击 ----
  if(Actions.attack && !player.charging && player.state!=='dodge' && player.state!=='attack' && player.state!=='heavy' && canAct){
    player.state='attack'; player.attackType='light';
    player.attackDur=LIGHT_DUR; player.recover=LIGHT_RECOVER;
    player.attackTimer=LIGHT_DUR+LIGHT_RECOVER; player.lunge=LIGHT_LUNGE;
    startSlash('light');
  }

  // ---- 跳跃 ----
  if(Actions.jump && !player.jumping && player.state!=='dodge'){
    player.jumping=true; player.jumpVz=JUMP_V;
  }
  if(player.jumping){
    player.jumpZ+=player.jumpVz; player.jumpVz-=GRAVITY;
    if(player.jumpZ<=0){ player.jumpZ=0; player.jumping=false; player.jumpVz=0; }
  }

  // ---- 攻击计时推进 ----
  if(player.state==='attack'||player.state==='heavy'){
    player.attackTimer-=dt;
    // lunge 前冲（仅动作前段）
    const elapsed=(player.attackDur+player.recover)-player.attackTimer;
    if(elapsed < player.attackDur*0.6){
      const v=DIR_VEC[player.facing];
      player.x+=v[0]*player.lunge*dt*12;
      player.y+=v[1]*player.lunge*dt*12;
    }
    if(player.attackTimer<=0){ player.state='idle'; player.attackType=null; }
  }

  // ---- 移动 ----
  let mvx=0,mvy=0; player.moving=false;
  if(player.state==='dodge'){
    mvx=player.dodgeDx*DODGE_SPEED; mvy=player.dodgeDy*DODGE_SPEED;
    player.dodgeT-=dt; if(player.dodgeT<=0)player.state='idle';
  } else if(player.state==='attack'||player.state==='heavy'){
    // 攻击中不自由移动（靠 lunge）
  } else {
    let sp=MOVE_SPEED;
    if(player.charging) sp*=CHARGE_MOVE_MULT;   // 蓄力时走得慢
    mvx=Actions.moveX*sp; mvy=Actions.moveY*sp;
    const d=vecToDir(Actions.moveX,Actions.moveY);
    if(d){ player.facing=d; player.moving=true; }
  }
  player.x+=mvx; player.y+=mvy;
  player.speedMag=Math.hypot(mvx,mvy);

  // 伪跑动相位
  if(player.moving){ player.runPhase+=dt*12; } else { player.runPhase*=0.8; }

  // ---- 体力回复 ----
  if(staminaDelay>0) staminaDelay-=dt;
  else if(player.stamina<player.staminaMax) player.stamina=Math.min(player.staminaMax, player.stamina+STAM_REGEN*dt);

  // ---- 边界 ----
  const pad=player.r;
  player.x=Math.max(room.x+pad,Math.min(room.x+room.w-pad,player.x));
  player.y=Math.max(room.y+pad,Math.min(room.y+room.h-pad,player.y));

  // 震屏衰减
  if(shake>0) shake=Math.max(0,shake-dt*40);
  updateFx(dt);
}

function updateFx(dt){
  for(let i=slashes.length-1;i>=0;i--){ slashes[i].life-=dt; if(slashes[i].life<=0)slashes.splice(i,1); }
  for(let i=hitsparks.length-1;i>=0;i--){ const s=hitsparks[i]; s.life-=dt; s.x+=s.vx; s.y+=s.vy; if(s.life<=0)hitsparks.splice(i,1); }
}

// ---------- 渲染 ----------
function drawRoom(){
  ctx.fillStyle='#3a322c'; ctx.fillRect(room.x,room.y,room.w,room.h);
  ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=1;
  for(let gx=room.x;gx<=room.x+room.w;gx+=48){ctx.beginPath();ctx.moveTo(gx,room.y);ctx.lineTo(gx,room.y+room.h);ctx.stroke();}
  for(let gy=room.y;gy<=room.y+room.h;gy+=48){ctx.beginPath();ctx.moveTo(room.x,gy);ctx.lineTo(room.x+room.w,gy);ctx.stroke();}
  ctx.strokeStyle='#6b5a4a'; ctx.lineWidth=6; ctx.strokeRect(room.x,room.y,room.w,room.h);
}

function drawSlash(s){
  const v=DIR_VEC[s.dir]; const ang=Math.atan2(v[1],v[0]);
  const t=1-s.life/s.maxLife; // 0->1
  ctx.save();
  ctx.translate(s.x, s.y - player.jumpZ*0.4);
  ctx.rotate(ang);
  ctx.globalAlpha=(1-t)*0.85;
  // 弧形刀光
  const col = s.type==='heavy' ? `rgba(255,${140-s.charge*60},90,1)` : 'rgba(255,235,150,1)';
  ctx.strokeStyle=col; ctx.lineWidth = s.type==='heavy'? (7+s.charge*5):4; ctx.lineCap='round';
  ctx.beginPath();
  const arc = s.type==='heavy'? 1.5:1.1;
  const rad = s.r*(0.7+0.5*t);
  ctx.arc(0,0,rad, -arc/2 + t*0.6, arc/2 + t*0.6);
  ctx.stroke();
  ctx.restore();
}

function drawPlayer(){
  const img=sprites[player.facing];
  const sw=img.width*SPRITE_SCALE, sh=img.height*SPRITE_SCALE;

  // 伪跑动：上下颠簸 + 左右倾斜
  let bobY=0, tilt=0, squash=1;
  if(player.moving){
    bobY = -Math.abs(Math.sin(player.runPhase))*6;     // 上下颠
    tilt = Math.sin(player.runPhase)*0.05;             // 轻微摆
    squash = 1 + Math.sin(player.runPhase*2)*0.03;
  }

  // 动态地面影子（随跳跃缩小、随颠簸不动）
  ctx.save();
  ctx.globalAlpha = player.iframe>0?0.45:0.3;
  ctx.fillStyle='#000';
  const shScale = 1 - Math.min(player.jumpZ/120,0.55);
  ctx.beginPath();
  ctx.ellipse(player.x, player.y, 20*shScale, 8*shScale, 0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // 蓄力光环
  if(player.charging){
    const r=player.chargeT/CHARGE_MAX;
    ctx.save();
    ctx.translate(player.x, player.y - player.jumpZ);
    ctx.globalAlpha=0.5+0.5*Math.sin(performance.now()/60);
    ctx.strokeStyle=`rgba(255,${160-r*120},80,1)`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,-sh*0.4, 26+r*22, 0, Math.PI*2*r); ctx.stroke();
    // 满蓄提示
    if(r>=1){ ctx.fillStyle='rgba(255,80,40,0.9)'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.fillText('蓄满!', 0, -sh*0.7); }
    ctx.restore();
  }

  // 角色
  ctx.save();
  if(player.iframe>0) ctx.globalAlpha=0.55;
  ctx.translate(player.x, player.y - player.jumpZ + bobY);
  ctx.rotate(tilt);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(img, -sw/2, -sh+6, sw, sh*squash);
  ctx.restore();

  // 刀光在角色之上
  slashes.forEach(drawSlash);
}

function drawHUD(){
  // 体力条
  const bx=room.x, by=room.y+room.h+14, bw=200, bh=12;
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(bx,by,bw,bh);
  const sr=player.stamina/player.staminaMax;
  ctx.fillStyle = sr<0.28? '#d9534f' : '#5bc0de';
  ctx.fillRect(bx,by,bw*sr,bh);
  ctx.strokeStyle='#6b5a4a'; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#9a8d80'; ctx.font='11px monospace'; ctx.textAlign='left';
  ctx.fillText('体力', bx, by-4);
  // 状态
  ctx.textAlign='right';
  const st=player.state==='dodge'?'闪避':player.charging?('蓄力 '+(player.chargeT/CHARGE_MAX*100|0)+'%'):player.state==='heavy'?'重击':player.state==='attack'?'轻击':player.jumping?'跳跃':player.moving?'移动':'待机';
  ctx.fillText('状态: '+st+'   朝向: '+player.facing, room.x+room.w, by-4);
}

function render(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#241e1a'; ctx.fillRect(0,0,W,H);
  // 震屏
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }
  drawRoom();
  if(loaded<total){
    ctx.fillStyle='#888'; ctx.font='16px sans-serif'; ctx.textAlign='center';
    ctx.fillText(`加载素材中… ${loaded}/${total}`, W/2, H/2);
    ctx.restore(); return;
  }
  drawPlayer();
  ctx.restore();
  drawHUD();
}

function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  update(dt); render();
  requestAnimationFrame(loop);
}
updatePadStatus();
requestAnimationFrame(loop);
</script>
</body>
</html>
